services:
  - type: web
    name: leejaehoon1234-btc-agent-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: USE_LLM
        value: "false"
      - key: USE_SPECIALIST_LLM
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: ANALYSIS_CACHE_TTL_SECONDS
        value: "300"
      - key: CORS_ORIGINS
        value: "https://leejaehoon1234.github.io,http://localhost:5173,http://127.0.0.1:5173"
